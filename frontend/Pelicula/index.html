<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Película - Niflis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Niflis</h1>
        <a href="../Principal/index.html">Volver al catálogo</a>
    </header>
    <main>
        <section id="informacionPelicula" class="informacion-pelicula">
            <!-- La información se carga desde JavaScript -->
        </section>
        <section class="seccion-resenas">
            <h2>Dejar una reseña</h2>
            <div id="avisoRegistro" style="display: none;">
                <p>Para publicar una reseña tenés que registrarte.</p>
                <a href="../Registro/index.html">Registrarse</a>
            </div>
            <form id="formResena">
                <label for="puntaje">Puntuación</label>
                <select id="puntaje" required>
                    <option value="">Seleccioná una puntuación</option>
                    <option value="1">1 - Muy mala</option>
                    <option value="2">2 - Mala</option>
                    <option value="3">3 - Regular</option>
                    <option value="4">4 - Buena</option>
                    <option value="5">5 - Excelente</option>
                </select>
                <label for="comentario">Comentario</label>
                <textarea id="comentario" placeholder="Escribí tu opinión sobre la película..." required></textarea>
                <button type="submit">Publicar reseña</button>
            </form>
        </section>
        <section class="lista-resenas">
            <h2>Reseñas de usuarios</h2>
            <div id="resenas">
                <!-- Las reseñas se cargan desde JavaScript -->
            </div>
        </section>
    </main>
    <footer>
        <p>© Niflis - Facundo Roldan</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
