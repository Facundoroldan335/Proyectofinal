
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar película - Niflis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Niflis</h1>
        <a href="../index.html">Volver al catálogo</a>
    </header>

    <main>
        <h2>Editar película</h2>

        <form id="formEditar">
            <input type="text" id="titulo" placeholder="Título" required>
            <input type="number" id="anio" placeholder="Año" required>
            <input type="text" id="portada" placeholder="URL de portada" required>
            <input type="text" id="director" placeholder="Director">
            <textarea id="sinopsis" placeholder="Sinopsis"></textarea>

            <h3>Seleccionar géneros</h3>

            <select id="genero">
                <option value="">Seleccionar género</option>
            </select>

            <button type="button" id="btnAgregarGenero">Agregar género</button>

            <div id="listaGeneros"></div>

            <button type="submit">Guardar cambios</button>
            <a href="../index.html">Cancelar</a>
        </form>
    </main>

    <footer>
        <p>© Niflis - Facundo Roldan</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
