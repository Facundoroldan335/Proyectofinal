<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Niflis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Niflis</h1>
        <p>Tu espacio para descubrir películas</p>
    </header>
    <main>
        <section class="registro">
            <h2>Crear una cuenta</h2>
            <p>Registrate para explorar películas y compartir tus opiniones.</p>
            <form id="formRegistro">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ingresá tu nombre" required>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Ingresá tu correo electrónico" required>
                <button type="submit">Registrarme</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© Niflis - Facundo Roldan</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
